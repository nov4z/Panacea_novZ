<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Arch Linux + CachyOS + Nothing OS Hybrid Emblem (Fix 2) -->
  <!-- Designed for Panacea Dock (Nothing OS philosophy) -->
  <g transform="translate(7, 7)" stroke="#000000" stroke-width="1.2" stroke-linejoin="round">
    <!-- Top Apex Triangle -->
    <polygon points="42,10 33,32 51,32" fill="#ffffff" />
    
    <!-- Left Upper Flank -->
    <polygon points="33,32 20,54 39,48" fill="#f4f4f4" />
    
    <!-- Left Lower Swoop (Arch base) -->
    <polygon points="20,54 9,76 31,70 39,48" fill="#ffffff" />
    
    <!-- Center Vault Structure (CachyOS origami facets) -->
    <polygon points="39,48 31,70 42,61 42,48" fill="#d0d0d0" />
    <polygon points="42,48 42,61 53,70 45,48" fill="#e0e0e0" />

    <!-- Right Upper Wing (CachyOS faceted fluke) -->
    <polygon points="51,32 45,48 64,54" fill="#fafafa" />

    <!-- Right Lower Swoop (Clean & balanced Arch base) -->
    <polygon points="64,54 45,48 53,70 75,76" fill="#ffffff" />

    <!-- Diagonally aligned speed circles with Nothing Red accent -->
    <circle cx="58" cy="22" r="2.7" fill="#ff2825" stroke="none" />
    <circle cx="66.5" cy="37" r="4.0" fill="#ffffff" stroke="none" />
    <circle cx="75" cy="52" r="5.5" fill="#ffffff" stroke="none" />
  </g>
</svg>
